name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes a running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  # Mirrors .docker/php/Dockerfile (pdo_sqlite added: the default suite runs in-memory).
  PHP_EXTENSIONS: mbstring, intl, bcmath, zip, exif, pcntl, gd, pdo_sqlite, pdo_mysql

jobs:
  quality:
    name: Pint · Larastan · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - run: cp .env.example .env

      - uses: ramsey/composer-install@v3

      - name: Pint (check only)
        run: vendor/bin/pint --test

      - name: Larastan (PHPStan level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Security audit
        run: composer audit

      # The committed OpenAPI document must be the one the code generates.
      - name: OpenAPI spec is up to date
        run: |
          php artisan scramble:export --path=/tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json || { echo '::error::docs/openapi.json is stale — run `make docs-api` and commit'; exit 1; }

  tests:
    name: Pest (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - run: cp .env.example .env

      - uses: ramsey/composer-install@v3

      - run: php artisan key:generate

      # The Concurrency suite needs MySQL — it has its own job below.
      - run: php artisan test --testsuite=Unit,Feature

  concurrency-tests:
    name: Pest concurrency (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway credentials for the ephemeral CI database only.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bazaar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - run: cp .env.example .env

      - uses: ramsey/composer-install@v3

      - run: php artisan key:generate

      # Real row locks under forked processes — proves no overselling and webhook idempotency.
      - run: php artisan test --testsuite=Concurrency
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bazaar_test
          DB_USERNAME: root
          DB_PASSWORD: root

  assets:
    name: Front-end build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
