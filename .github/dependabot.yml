version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps; majors still arrive individually.
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind v4 drops the @tailwind directives and the JS config: a migration, not a bump.
      # Minor/patch releases of v3 keep coming through; lift this when the migration is planned.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
