services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      php:
        condition: service_started
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/app:delegated
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        WWW_UID: ${WWW_UID:-1000}
        WWW_GID: ${WWW_GID:-1000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app:delegated
      # Named volume — survives compose restarts, isolated per project.
      # Wiped only by `docker compose down -v` / `make nuke`.
      - composer_cache:/root/.composer/cache
    restart: unless-stopped

  # Queue worker: mail, database notifications, WebP derivatives, provider refunds all run
  # as jobs — without this the demo silently does none of it. Same image and code mount as
  # php. `queue:listen` re-boots the framework per job, so code changes on the bind mount
  # apply immediately (a long-lived `queue:work` would keep stale code in memory).
  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        WWW_UID: ${WWW_UID:-1000}
        WWW_GID: ${WWW_GID:-1000}
    user: www-data
    environment:
      HOME: /tmp
    working_dir: /app
    # `make init` installs vendor/ after `up`: wait for it instead of crash-looping until then.
    command: >
      sh -c 'until [ -f vendor/autoload.php ]; do echo "queue: waiting for composer install…"; sleep 3; done;
             exec php artisan queue:listen redis --tries=3 --backoff=10 --timeout=120'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app:delegated
    # After `exec` the worker *is* PID 1, so the container dies (and restarts) with it; the
    # check confirms PID 1 is still the worker and not a stuck shell. No procps needed.
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'queue:listen' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Scheduler: runs the cron-style tasks in routes/console.php (pending-order expiry,
  # refund reconciliation, token pruning). One process, ticks every minute.
  scheduler:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        WWW_UID: ${WWW_UID:-1000}
        WWW_GID: ${WWW_GID:-1000}
    user: www-data
    environment:
      HOME: /tmp
    working_dir: /app
    command: >
      sh -c 'until [ -f vendor/autoload.php ]; do sleep 3; done;
             exec php artisan schedule:work'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app:delegated
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'schedule:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-storage-engine=InnoDB
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      # Persistent DB on a named volume — data survives `make down`/restarts,
      # isolated from the host filesystem. Removed only by `make nuke`.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Local mail catcher: PHP sends to mailpit:1025 (SMTP), you read mail in the
  # web UI. Nothing leaves the machine — dev only.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mysql_data:
  composer_cache:
